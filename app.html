<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuiltMath</title>
<style>
  body { font-family: Georgia, serif; max-width: 760px; margin: 0 auto; padding: 1em; color: #33262e; background: #faf4f6; }
  h1 { font-size: 1.5em; }
  .card { background: #fff; border: 1px solid #ecd9e1; border-radius: 10px; padding: 1em 1.2em; margin: 1em 0; }
  .card h2 { margin-top: 0; font-size: 1.1em; }
  label { display: inline-block; min-width: 185px; margin: 0.3em 0; }
  input, select { padding: 0.3em; border: 1px solid #d3b4c2; border-radius: 6px; width: 110px; }
  .out { background: #f6eaf0; border-left: 4px solid #6d3350; padding: 0.6em 0.9em; border-radius: 0 8px 8px 0; margin-top: 0.7em; }
  .preset { display:inline-block; margin: 0 0.4em 0.4em 0; padding: 0.25em 0.7em; background: #f0dde6; border-radius: 20px; cursor: pointer; font-size: 0.85em; border: 1px solid #d3b4c2; }
  .note { color: #7a5f6c; font-size: 0.9em; }
  a { color: #6d3350; }
</style>
</head>
<body>
<h1>&#129525; QuiltMath</h1>
<p class="note">Constants: 0.5 in total seam allowance per block, 42 in usable fabric width, 15% cutting waste, backing 4 in overhang per side, binding strips 2.5 in wide. <a href="index.html">About</a></p>

<div class="card">
  <h2>1. Quilt top</h2>
  <div>
    <span class="preset" data-w="36" data-l="52">Baby</span>
    <span class="preset" data-w="50" data-l="65">Throw</span>
    <span class="preset" data-w="66" data-l="90">Twin</span>
    <span class="preset" data-w="90" data-l="100">Queen</span>
  </div>
  <label for="width">Width (in):</label><input id="width" type="number" value="50" min="6"><br>
  <label for="length">Length (in):</label><input id="length" type="number" value="65" min="6"><br>
  <label for="block">Block size (in):</label><input id="block" type="number" value="5" min="1" step="0.5">
  <div class="out" id="blockOut">-</div>
  <div class="out" id="sizeOut">-</div>
</div>

<div class="card">
  <h2>2. Fabric</h2>
  <label for="fabPrice">Fabric ($/yard):</label><input id="fabPrice" type="number" value="13" min="0" step="0.5">
  <div class="out" id="fabOut">-</div>
</div>

<div class="card">
  <h2>3. Backing and binding</h2>
  <label for="backPrice">Backing ($/yard):</label><input id="backPrice" type="number" value="11" min="0" step="0.5">
  <div class="out" id="backOut">-</div>
  <div class="out" id="bindOut">-</div>
</div>

<div class="card">
  <h2>4. Honest total</h2>
  <label for="batting">Batting ($):</label><input id="batting" type="number" value="25" min="0"><br>
  <label for="misc">Thread, needles, misc ($):</label><input id="misc" type="number" value="12" min="0">
  <div class="out" id="costOut">-</div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
  function fmt(n, d) { return n.toFixed(d === undefined ? 2 : d); }
  var SIZES = [[36,52,'baby'],[50,65,'throw'],[66,90,'twin'],[90,100,'queen'],[104,100,'king']];

  function update() {
    var w = Math.max(6, num('width')), l = Math.max(6, num('length')), b = Math.max(1, num('block'));
    var grid = QuiltMath.blocksFor(w, l, b);
    document.getElementById('blockOut').textContent =
      grid.cols + ' x ' + grid.rows + ' = ' + grid.count + ' blocks, top finishes ' + grid.actualW + 'x' + grid.actualL + ' in.';
    var sizeName = '';
    for (var i = 0; i < SIZES.length; i++) if (SIZES[i][0] === w && SIZES[i][1] === l) sizeName = SIZES[i][2];
    document.getElementById('sizeOut').textContent =
      sizeName ? QuiltMath.sizeVerdict(sizeName) : 'Custom size - the math does not care, and now it is done right.';

    var fy = QuiltMath.fabricYards(grid.count, b, 0.5);
    document.getElementById('fabOut').textContent =
      fmt(fy) + ' yards of print fabric (' + grid.count + ' blocks at ' + (b + 0.5) + ' in cut, 15% waste) - buy ' + (Math.ceil(fy * 4) / 4).toFixed(2) + ' and thank yourself.';

    var bk = QuiltMath.backingYards(w, l);
    document.getElementById('backOut').textContent =
      fmt(bk.yards) + ' yards of backing, ' + bk.note + '.';
    var bd = QuiltMath.binding(w, l, 2.5);
    document.getElementById('bindOut').textContent =
      'Binding: ' + bd.perimeter + ' in around, ' + bd.strips + ' strips of 2.5 in, ' + fmt(bd.yards) + ' yards.';

    var total = QuiltMath.quiltCost(fy, num('fabPrice'), bk.yards, num('backPrice'), num('batting'), num('misc'));
    document.getElementById('costOut').textContent =
      '$' + total.toFixed(2) + ' in materials. ' + QuiltMath.costVerdict(total);
  }

  var presets = document.querySelectorAll('.preset');
  for (var i = 0; i < presets.length; i++) {
    presets[i].addEventListener('click', function () {
      document.getElementById('width').value = this.getAttribute('data-w');
      document.getElementById('length').value = this.getAttribute('data-l');
      update();
    });
  }
  var inputs = document.querySelectorAll('input, select');
  for (var j = 0; j < inputs.length; j++) inputs[j].addEventListener('input', update);
  update();
})();
</script>
</body>
</html>
